name: Keep Supabase Alive

# 2026-07 개편 배경:
#   3일 1회 핑으로도 2026-06-29 프로젝트가 일시정지(paused)됨.
#   Supabase 무료 플랜의 판정 기준은 "지난 7일간 하루 몇 회 수준의 DB 요청"(볼륨)이라
#   3일 1회는 미달 — 핑을 하루 3회로 상향.
#   또한 핑만으로는 정지를 보증할 수 없어(매일 핑에도 정지된 사례 보고 있음),
#   정지를 감지하면 Management API로 자동 복구(Resume)하는 단계를 추가.
#   → 정지돼도 최대 8시간 안에 자동 복구되고, 90일 방치로 인한 영구 소멸도 원천 차단됨.

on:
  schedule:
    - cron: '17 1,9,17 * * *'   # 하루 3회 (KST 10:17 / 18:17 / 다음날 02:17)
  workflow_dispatch:             # GitHub UI에서 수동 실행도 가능

# 타임스탬프 파일을 커밋해서 60일 무활동 자동 비활성화를 방지하기 위함
permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: xbaerlefftnhytcbyaou   # bupyeong_renaissance_center_v2 (공개 정보)

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 프로젝트가 일시정지 상태(INACTIVE)면 Management API로 깨운다.
      # SUPABASE_ACCESS_TOKEN(계정 personal access token)이 등록된 repo에서만 동작 —
      # 토큰이 없는 포크에서는 이 단계를 조용히 건너뛰고 핑만 수행한다.
      - name: Wake project if paused
        id: wake
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN 미설정 — 깨우기 단계 생략 (핑만 수행)"
            exit 0
          fi

          STATUS=$(curl -sS --fail \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r .status)
          echo "프로젝트 상태: $STATUS"

          case "$STATUS" in
            INACTIVE)
              echo "일시정지 상태 — 복구(Resume) API 호출"
              curl -sS --fail -X POST \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
              echo ""
              echo "복구 요청 완료 — 기동에 몇 분 걸리므로 이번 회차 핑은 생략 (다음 회차가 검증)"
              echo "skip_ping=true" >> "$GITHUB_OUTPUT"
              ;;
            RESTORING|COMING_UP|RESTARTING|PAUSING)
              echo "상태 전환 중 — 이번 회차 핑 생략"
              echo "skip_ping=true" >> "$GITHUB_OUTPUT"
              ;;
            ACTIVE_HEALTHY)
              echo "정상 가동 중"
              ;;
            *)
              echo "예상 밖 상태($STATUS) — 핑을 시도해 실패 시 알림이 가도록 진행"
              ;;
          esac

      # 핑이 실패하면(키/URL 만료, 정지 미복구 등) 워크플로우가 실패로 끝나
      # GitHub가 자동으로 "워크플로우 실패" 이메일을 보냄.
      - name: Ping Supabase REST API
        if: steps.wake.outputs.skip_ping != 'true'
        run: |
          curl -sS --fail \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo ""
          echo "✅ Supabase ping success at $(date -u)"

      # 마지막 커밋이 50일 이상 전일 때만 타임스탬프를 커밋 → 60일 자동 비활성화 방지.
      # 평소 개발 푸시가 있으면 봇 커밋은 생기지 않고, 오래 방치될 때만 한 번 끼어들어 타이머를 리셋함.
      - name: Reset 60-day timer if repo is idle
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -lt 50 ]; then
            echo "최근 활동 있음 ($DAYS일) — 커밋 생략"
            exit 0
          fi
          echo "50일 이상 방치됨 — 타임스탬프 커밋으로 타이머 리셋"
          mkdir -p .github
          echo "Last keep-alive timer reset: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive-last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive-last-run.txt
          git commit -m "chore: keep-alive timer reset $(date -u +'%Y-%m-%d') [skip ci]"
          git push
